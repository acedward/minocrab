[package]
name = "minocrab-std"
description = "MinoCrab L3: the standard library — ports of Compact's standard-library.compact, each differential-tested against compactc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["midnight", "zero-knowledge", "circuit", "stdlib", "borsh"]
categories = ["cryptography::cryptocurrencies", "cryptography"]
# lean/ is the machine-checked proof development for the numeric and
# visibility invariants (M25) — the warrant behind the leaves' const
# asserts, shipped with the crate the way minocrab-ir ships its pass
# proofs (tests/lean_claims.rs is the in-repo drift gate; .lake/ build
# artifacts must not ship).
include = [
    "src/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "lean/lakefile.toml",
    "lean/lake-manifest.json",
    "lean/MinocrabStdProofs.lean",
    "lean/MinocrabStdProofs/*.lean",
]

[lints]
workspace = true

[dependencies]
minocrab.workspace = true
# The typed ledger block (M9 phase 7): `v3::ledger`'s LedgerMap/LedgerCell/
# LedgerCounter are one-line wrappers over this crate's op emission, so the
# ADTs sit ABOVE the ops — minocrab-ledger stays the pure op layer its module
# docs describe and gains no dependency of its own.
minocrab-ledger.workspace = true
# The Borsh SCHEMA walk (v3::borsh::schema) only, behind the off-by-default
# `borsh-schema` feature: nothing shipping links borsh, and a test build turns
# the feature on from its own [dev-dependencies] entry (see
# minocrab-contracts).
borsh = { workspace = true, optional = true }
# `#[derive(CircuitArg)]`, re-exported next to the trait it implements
# (v3::CircuitArg names both, as serde's does).
minocrab-macros = { workspace = true, optional = true }

[features]
default = ["macros"]
macros = ["dep:minocrab-macros"]
borsh-schema = ["dep:borsh"]

[package.metadata.docs.rs]
# The only featured crate in the workspace. `borsh-schema` is off by default
# (nothing shipping links borsh) but it is what documents `v3::borsh::schema`,
# so docs.rs gets the full surface.
all-features = true

[dev-dependencies]
minocrab-sim = { path = "../minocrab-sim", features = ["unstable"] }
# The blind ops' gate (M40, tests/v3_blind.rs) seeds a `StateValue` and runs
# each transcript through Midnight's on-chain VM via the executor; these
# three are the state tree's own types. Already in the lock.
midnight-onchain-state.workspace = true
midnight-storage.workspace = true
midnight-base-crypto.workspace = true
midnight-onchain-vm.workspace = true
minocrab-ir = { path = "../minocrab-ir", features = ["unstable"] }
minocrab-zkir = { path = "../minocrab-zkir" }
# v3 secp tests generate ECDSA signatures through zkir-v3's own off-circuit
# helpers and check the Ethereum address against a native keccak.
midnight-zkir-v3.workspace = true
midnight-transient-crypto.workspace = true
midnight-curves.workspace = true
sha3.workspace = true
# The persistent-hash oracle of the Borsh flavor (M11 stage 9): the digest the
# chip produces must be SHA-256 of `borsh::to_vec`. Already in the lock (the
# simulator hashes with it), so no new dependency enters the graph.
sha2.workspace = true
# The Borsh layer's conformance oracle (M11 stage 1): the in-circuit bytes are
# asserted equal to `borsh::to_vec` of a plain Rust twin, which is the whole
# claim of the module — the subset IS Borsh. Dev-dependency only, same posture
# as minocrab-contracts' (nothing shipping links borsh).
borsh.workspace = true
